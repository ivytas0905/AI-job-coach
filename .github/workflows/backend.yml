name: Backend

on:
  pull_request:
  push:
    branches: [next-main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: resume
          POSTGRES_PASSWORD: resume
          POSTGRES_DB: resume_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resume -d resume_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: agent

    env:
      RESUME_TEST_POSTGRES_URL: postgresql+asyncpg://resume:resume@localhost:5432/resume_test
      RESUME_DATABASE_URL: postgresql+asyncpg://resume:resume@localhost:5432/resume_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src tests
      - run: python -m pytest -q
      - run: python -m alembic upgrade head
